<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chương trình máy tính đơn giản</title>
    <link rel="stylesheet" href="Styles/style.css">
    <script src="Scripts/jquery.min.js"></script>
    <script src="Scripts/script.js"></script>
</head>
<body>
    <div class="calc-container">
        <input type="text" id="num1" class="calc-input" value="12">
        <button type="button" class="calc-btn op-btn" data-op="+">+</button>
        <button type="button" class="calc-btn op-btn active" data-op="-">-</button>
        <button type="button" class="calc-btn op-btn" data-op="*">x</button>
        <button type="button" class="calc-btn op-btn" data-op="/">/</button>
        <input type="text" id="num2" class="calc-input" value="14">
        <span class="equals-sign">=</span>
        <input type="text" id="result" class="calc-input result-input" readonly value="-2">
    </div>
</body>
</html>
