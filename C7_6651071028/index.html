<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyển hướng đến đường link</title>
    <link rel="stylesheet" href="Styles/style.css">
    <script src="Scripts/jquery.min.js"></script>
    <script src="Scripts/script.js"></script>
</head>
<body>
    <h1>Nhập đường link và nhấn "Submit" để chuyển hướng:</h1>
    <form id="linkForm">
        <input type="text" id="linkInput" placeholder="Nhập đường link (vd: https://google.com)">
        <button type="submit">Submit</button>
    </form>
</body>
</html>
